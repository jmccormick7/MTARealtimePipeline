apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-consumer-irt-alert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-consumer
      feed: irt
      type: alert
  template:
    metadata:
      labels:
        app: redis-consumer
        feed: irt
        type: alert
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: consumer
          image: johnmccormick7/mta-gtfs-pipeline:gtfs-redis-consumer-latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_TOPICS
              value: "feed-irt-alert"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: brokers
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: redis-config       
                  key:  redis_addr         
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis          
                  key:  redis-password
