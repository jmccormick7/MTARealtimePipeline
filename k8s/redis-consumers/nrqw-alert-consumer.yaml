apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-consumer-nrqw-alert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-consumer
      feed: nrqw
      type: alert
  template:
    metadata:
      labels:
        app: redis-consumer
        feed: nrqw
        type: alert
    spec:
      containers:
        - name: consumer
          image: johnmccormick7/mta-gtfs-pipeline:gtfs-redis-consumer-latest
          env:
            - name: KAFKA_TOPICS
              value: "feed-nrqw-alert"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: brokers
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: redis_addr
